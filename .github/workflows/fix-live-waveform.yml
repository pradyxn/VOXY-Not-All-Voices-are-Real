name: Patch live waveform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch live microphone analysis
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('frontend/app/page.tsx')
          text = page.read_text(encoding='utf-8')

          marker = 'function scrollToSection(id: string) {\n  document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });\n}\n'
          helpers = r'''

          const LIVE_SAMPLE_RATE = 16000;
          const LIVE_WINDOW_SECONDS = 4.0375;
          const LIVE_TARGET_SAMPLES = 64600;

          function downsampleToTarget(input: Float32Array, sourceRate: number): Float32Array {
            if (input.length === LIVE_TARGET_SAMPLES && sourceRate === LIVE_SAMPLE_RATE) return input;
            const output = new Float32Array(LIVE_TARGET_SAMPLES);
            if (!input.length) return output;
            const ratio = input.length / LIVE_TARGET_SAMPLES;
            for (let index = 0; index < LIVE_TARGET_SAMPLES; index += 1) {
              const sourcePosition = index * ratio;
              const left = Math.min(Math.floor(sourcePosition), input.length - 1);
              const right = Math.min(left + 1, input.length - 1);
              const fraction = sourcePosition - left;
              output[index] = input[left] + (input[right] - input[left]) * fraction;
            }
            return output;
          }

          function encodeWav(samples: Float32Array, sampleRate: number): ArrayBuffer {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset: number, value: string) => {
              for (let index = 0; index < value.length; index += 1) {
                view.setUint8(offset + index, value.charCodeAt(index));
              }
            };
            writeString(0, "RIFF");
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(8, "WAVE");
            writeString(12, "fmt ");
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, "data");
            view.setUint32(40, samples.length * 2, true);
            for (let index = 0; index < samples.length; index += 1) {
              const sample = Math.max(-1, Math.min(1, samples[index]));
              view.setInt16(44 + index * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
            }
            return buffer;
          }
          '''
          if 'const LIVE_SAMPLE_RATE = 16000;' not in text:
              if marker not in text:
                  raise SystemExit('scrollToSection marker not found')
              text = text.replace(marker, marker + helpers, 1)

          old_refs = '''  const mediaRecorder = useRef<MediaRecorder | null>(null);\n  const mediaStream = useRef<MediaStream | null>(null);\n  const socket = useRef<WebSocket | null>(null);\n  const intentionalStop = useRef(false);\n  const stopSegments = useRef<(() => void) | null>(null);\n  const [verification, setVerification] = useState(false);'''
          new_refs = '''  const mediaStream = useRef<MediaStream | null>(null);\n  const socket = useRef<WebSocket | null>(null);\n  const audioContext = useRef<AudioContext | null>(null);\n  const audioSource = useRef<MediaStreamAudioSourceNode | null>(null);\n  const analyser = useRef<AnalyserNode | null>(null);\n  const pcmProcessor = useRef<ScriptProcessorNode | null>(null);\n  const silentGain = useRef<GainNode | null>(null);\n  const waveformCanvas = useRef<HTMLCanvasElement | null>(null);\n  const waveformFrame = useRef<number | null>(null);\n  const snapshotTimer = useRef<number | null>(null);\n  const pcmChunks = useRef<Float32Array[]>([]);\n  const pcmSampleCount = useRef(0);\n  const modelRequestPending = useRef(false);\n  const intentionalStop = useRef(false);\n  const [verification, setVerification] = useState(false);'''
          if old_refs not in text:
              raise SystemExit('live refs block not found')
          text = text.replace(old_refs, new_refs, 1)

          live_block_pattern = r'  function stopLiveSimulation\(silent = false\) \{.*?\n  const title = busy'
          replacement = r'''  function stopLiveSimulation(silent = false) {
            intentionalStop.current = silent;
            if (snapshotTimer.current !== null) {
              window.clearInterval(snapshotTimer.current);
              snapshotTimer.current = null;
            }
            if (waveformFrame.current !== null) {
              window.cancelAnimationFrame(waveformFrame.current);
              waveformFrame.current = null;
            }
            if (pcmProcessor.current) {
              pcmProcessor.current.onaudioprocess = null;
              try { pcmProcessor.current.disconnect(); } catch { /* already disconnected */ }
              pcmProcessor.current = null;
            }
            try { silentGain.current?.disconnect(); } catch { /* already disconnected */ }
            try { audioSource.current?.disconnect(); } catch { /* already disconnected */ }
            audioSource.current = null;
            analyser.current = null;
            silentGain.current = null;
            if (audioContext.current && audioContext.current.state !== "closed") {
              void audioContext.current.close();
            }
            audioContext.current = null;
            pcmChunks.current = [];
            pcmSampleCount.current = 0;
            modelRequestPending.current = false;
            mediaStream.current?.getTracks().forEach((track) => track.stop());
            socket.current?.close(1000, "client stopped");
            mediaStream.current = null;
            socket.current = null;
            setLiveActive(false);
            const canvas = waveformCanvas.current;
            if (canvas) {
              const ctx = canvas.getContext("2d");
              if (ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const mid = canvas.height / 2;
                ctx.beginPath();
                ctx.moveTo(0, mid);
                ctx.lineTo(canvas.width, mid);
                ctx.strokeStyle = "rgba(198,233,61,.22)";
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          async function startLiveSimulation() {
            setLiveError(null);
            setAnalysisError(null);
            setResult(liveListeningResult);
            modelRequestPending.current = false;
            pcmChunks.current = [];
            pcmSampleCount.current = 0;
            if (!navigator.mediaDevices?.getUserMedia || !window.AudioContext) {
              setLiveError("This browser does not support live microphone analysis.");
              return;
            }

            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              const webSocketUrl = getWebSocketUrl(API, window.location.protocol);
              logWebSocket("attempting connection", webSocketUrl);
              const liveSocket = new WebSocket(webSocketUrl);
              const context = new AudioContext();
              await context.resume();

              const source = context.createMediaStreamSource(stream);
              const analyserNode = context.createAnalyser();
              analyserNode.fftSize = 2048;
              analyserNode.smoothingTimeConstant = 0.12;
              const processor = context.createScriptProcessor(4096, 1, 1);
              const silent = context.createGain();
              silent.gain.value = 0;

              source.connect(analyserNode);
              source.connect(processor);
              processor.connect(silent);
              silent.connect(context.destination);

              mediaStream.current = stream;
              socket.current = liveSocket;
              audioContext.current = context;
              audioSource.current = source;
              analyser.current = analyserNode;
              pcmProcessor.current = processor;
              silentGain.current = silent;
              intentionalStop.current = false;

              const drawWaveform = () => {
                const canvas = waveformCanvas.current;
                const activeAnalyser = analyser.current;
                if (!canvas || !activeAnalyser || !liveActive) return;
                const ratio = window.devicePixelRatio || 1;
                const width = Math.max(1, Math.floor(canvas.clientWidth * ratio));
                const height = Math.max(1, Math.floor(canvas.clientHeight * ratio));
                if (canvas.width !== width || canvas.height !== height) {
                  canvas.width = width;
                  canvas.height = height;
                }
                const ctx = canvas.getContext("2d");
                if (!ctx) return;
                const data = new Uint8Array(activeAnalyser.fftSize);
                activeAnalyser.getByteTimeDomainData(data);
                ctx.clearRect(0, 0, width, height);
                ctx.strokeStyle = "rgba(198,233,61,.95)";
                ctx.lineWidth = Math.max(1.5, ratio * 1.6);
                ctx.beginPath();
                const slice = width / data.length;
                for (let index = 0; index < data.length; index += 1) {
                  const normalized = (data[index] - 128) / 128;
                  const x = index * slice;
                  const y = height / 2 + normalized * height * 0.42;
                  if (index === 0) ctx.moveTo(x, y);
                  else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.strokeStyle = "rgba(198,233,61,.10)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, height / 2);
                ctx.lineTo(width, height / 2);
                ctx.stroke();
                waveformFrame.current = window.requestAnimationFrame(drawWaveform);
              };

              processor.onaudioprocess = (event) => {
                const input = event.inputBuffer.getChannelData(0);
                const copy = new Float32Array(input);
                pcmChunks.current.push(copy);
                pcmSampleCount.current += copy.length;
                const maxSamples = Math.ceil(context.sampleRate * (LIVE_WINDOW_SECONDS + 0.5));
                while (pcmChunks.current.length > 1 && pcmSampleCount.current > maxSamples) {
                  const removed = pcmChunks.current.shift();
                  if (removed) pcmSampleCount.current -= removed.length;
                }
              };

              const buildRollingWindow = () => {
                const needed = Math.ceil(context.sampleRate * LIVE_WINDOW_SECONDS);
                if (pcmSampleCount.current < needed) return null;
                const joined = new Float32Array(pcmSampleCount.current);
                let offset = 0;
                for (const chunk of pcmChunks.current) {
                  joined.set(chunk, offset);
                  offset += chunk.length;
                }
                const latest = joined.subarray(Math.max(0, joined.length - needed));
                return downsampleToTarget(latest, context.sampleRate);
              };

              const sendRollingWindow = () => {
                if (liveSocket.readyState !== WebSocket.OPEN || modelRequestPending.current) return;
                const samples = buildRollingWindow();
                if (!samples) return;
                modelRequestPending.current = true;
                logWebSocket("sending rolling 4-second WAV snapshot", { samples: samples.length });
                liveSocket.send(encodeWav(samples, LIVE_SAMPLE_RATE));
              };

              liveSocket.onopen = () => {
                logWebSocket("onopen");
                setLiveSeconds(0);
                setLiveActive(true);
                window.setTimeout(() => {
                  if (waveformFrame.current === null) waveformFrame.current = window.requestAnimationFrame(drawWaveform);
                }, 0);
                snapshotTimer.current = window.setInterval(sendRollingWindow, 1000);
              };

              liveSocket.onmessage = (event) => {
                modelRequestPending.current = false;
                try {
                  if (typeof event.data !== "string") return;
                  const update = JSON.parse(event.data) as Result & { error?: string };
                  logWebSocket("onmessage", update);
                  if (update.error) {
                    setLiveError(update.error);
                    return;
                  }
                  setResult({
                    ...update,
                    mode: "pretrained",
                    model_message: "LIVE MODEL ANALYSIS - rolling 4-second AASIST window",
                  });
                } catch (error) {
                  logWebSocket("invalid server message", error);
                }
              };

              liveSocket.onerror = () => {
                logWebSocket("onerror", "Network error or connection refused");
              };

              liveSocket.onclose = (event) => {
                logWebSocket("onclose", { code: event.code, reason: event.reason });
                modelRequestPending.current = false;
                if (snapshotTimer.current !== null) {
                  window.clearInterval(snapshotTimer.current);
                  snapshotTimer.current = null;
                }
                if (intentionalStop.current || event.code === 1000) {
                  setLiveError(null);
                } else if (event.code === 1011 && event.reason.toLowerCase().includes("detector")) {
                  setLiveError("Backend closed the connection because the AASIST detector is unavailable.");
                } else if (event.code === 1006) {
                  setLiveError("WebSocket connection refused or interrupted. Check that the backend is running and reachable.");
                } else if (event.reason) {
                  setLiveError(`Backend closed the live connection (${event.code}): ${event.reason}`);
                } else {
                  setLiveError(`Live connection closed unexpectedly (code ${event.code}).`);
                }
                setLiveActive(false);
                void context.close();
              };
            } catch (error) {
              setLiveError(
                error instanceof DOMException && error.name === "NotAllowedError"
                  ? "Microphone permission was denied."
                  : error instanceof Error
                    ? error.message
                    : "Unable to start microphone analysis.",
              );
              stopLiveSimulation();
            }
          }

          const title = busy'''
          new_text, count = re.subn(live_block_pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('live function block not found')
          text = new_text

          old_graph = '''            <div className="timeline-graph" aria-label="Live synthetic score timeline">\n              <svg viewBox="0 0 400 130" role="img" aria-label="Synthetic score by analysis window" style={{ width: "100%", height: "170px", display: "block", color: "#c6e93d" }}>\n                <line x1="0" y1="20" x2="400" y2="20" stroke="currentColor" strokeOpacity=".12" />\n                <line x1="0" y1="65" x2="400" y2="65" stroke="currentColor" strokeOpacity=".12" />\n                <line x1="0" y1="110" x2="400" y2="110" stroke="currentColor" strokeOpacity=".12" />\n                {result.timeline.length > 0 && (() => {\n                  const denominator = Math.max(result.timeline.length - 1, 1);\n                  const points = result.timeline.map((score, index) => {\n                    const x = (index / denominator) * 400;\n                    const y = 110 - (Math.max(0, Math.min(score, 100)) * 0.9);\n                    return { x, y, score, index };\n                  });\n                  return (\n                    <>\n                      <polyline fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" points={points.map((point) => `${point.x},${point.y}`).join(" ")} />\n                      {points.map((point) => (\n                        <circle key={point.index} cx={point.x} cy={point.y} r="4.5" fill="currentColor">\n                          <title>{`Window ${point.index + 1}: ${point.score}`}</title>\n                        </circle>\n                      ))}\n                    </>\n                  );\n                })()}\n              </svg>\n            </div>'''
          new_graph = '''            <div className="timeline-graph" aria-label="Live synthetic score timeline">\n              <svg viewBox="0 0 400 130" role="img" aria-label="Synthetic score by analysis window" style={{ width: "100%", height: "170px", display: "block", color: "#c6e93d" }}>\n                <line x1="0" y1="20" x2="400" y2="20" stroke="currentColor" strokeOpacity=".12" />\n                <line x1="0" y1="65" x2="400" y2="65" stroke="currentColor" strokeOpacity=".12" />\n                <line x1="0" y1="110" x2="400" y2="110" stroke="currentColor" strokeOpacity=".12" />\n                {result.timeline.length > 0 && (() => {\n                  const denominator = Math.max(result.timeline.length - 1, 1);\n                  const points = result.timeline.map((score, index) => {\n                    const x = (index / denominator) * 400;\n                    const y = 110 - (Math.max(0, Math.min(score, 100)) * 0.9);\n                    return { x, y, score, index };\n                  });\n                  return (\n                    <>\n                      <polyline fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" points={points.map((point) => `${point.x},${point.y}`).join(" ")} />\n                      {points.map((point) => (\n                        <circle key={point.index} cx={point.x} cy={point.y} r="4.5" fill="currentColor">\n                          <title>{`Window ${point.index + 1}: ${point.score}`}</title>\n                        </circle>\n                      ))}\n                    </>\n                  );\n                })()}\n              </svg>\n            </div>\n            <div className="live-waveform-panel" style={{ marginTop: "10px", borderTop: "1px solid rgba(198,233,61,.12)", paddingTop: "10px" }}>\n              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "7px", fontSize: "10px", letterSpacing: ".12em", textTransform: "uppercase", color: "rgba(198,233,61,.78)" }}>\n                <span>Live audio waveform</span><span>{liveActive ? "MIC INPUT" : "STANDBY"}</span>\n              </div>\n              <canvas ref={waveformCanvas} aria-label="Live microphone waveform" style={{ width: "100%", height: "105px", display: "block", borderRadius: "10px", background: "rgba(255,255,255,.018)" }} />\n            </div>'''
          if old_graph not in text:
              raise SystemExit('timeline graph block not found')
          text = text.replace(old_graph, new_graph, 1)

          old_score = '<div className="score">{Math.round(result.synthetic_score)}<span>/100</span></div>'
          new_score = '<div className="score">{liveActive && result.windows_analyzed === 0 ? "—" : Math.round(result.synthetic_score)}<span>/100</span></div>'
          if old_score not in text:
              raise SystemExit('score block not found')
          text = text.replace(old_score, new_score, 1)

          page.write_text(text, encoding='utf-8')

          main = Path('backend/app/main.py')
          main_text = main.read_text(encoding='utf-8')
          old_suffix = 'with tempfile.NamedTemporaryFile(delete=False, suffix=".webm") as temporary:\n                    temporary.write(chunk)'
          new_suffix = 'with tempfile.NamedTemporaryFile(delete=False, suffix=".wav") as temporary:\n                    temporary.write(chunk)'
          if old_suffix not in main_text:
              raise SystemExit('WebSocket temp suffix block not found')
          main_text = main_text.replace(old_suffix, new_suffix, 1)
          main_text = main_text.replace(
              'The frontend sends one complete, independently decodable WebM/Opus blob\n    approximately every four seconds. Each blob is decoded exactly once and\n    produces one AASIST score. Keeping segment boundaries explicit avoids trying\n    to decode incomplete MediaRecorder WebM fragments.',
              'The frontend sends complete 16 kHz mono WAV snapshots containing a\n    rolling 4-second microphone window. Each snapshot is independently decodable\n    and can be analyzed repeatedly as the speaker continues talking.',
          )
          main.write_text(main_text, encoding='utf-8')

      - name: Commit patched files
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/page.tsx backend/app/main.py
          git diff --cached --check
          git commit -m "fix: add live waveform and rolling microphone inference"
          git push origin main
      - name: Remove this patch workflow
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/fix-live-waveform.yml || true
          git diff --cached --quiet || (git commit -m "chore: remove temporary patch workflow" && git push origin main)
