name: VOXY repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Repair live and upload paths
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          message = subprocess.check_output(['git','log','-1','--pretty=%s'], text=True).strip()
          if message.startswith('fix: make live risk'):
              raise SystemExit(0)

          # ---------- backend ----------
          p = Path('backend/app/main.py')
          s = p.read_text(encoding='utf-8')
          if 'from fastapi import Body,' not in s:
              s = s.replace('from fastapi import FastAPI, File, HTTPException, UploadFile, WebSocket, WebSocketDisconnect', 'from fastapi import Body, FastAPI, File, HTTPException, UploadFile, WebSocket, WebSocketDisconnect', 1)
          s = s.replace('    allow_origins=[FRONTEND_ORIGIN, "http://localhost:3000"],\n    allow_credentials=True,\n', '    allow_origins=["*"],\n    allow_credentials=False,\n', 1)
          if '@app.post("/api/live")' not in s:
              marker = '\n\n@app.websocket("/ws/analyze")\n'
              endpoint = '''\n\n@app.post("/api/live")\nasync def analyze_live_snapshot(audio: bytes = Body(...)) -> dict:\n    """Analyze one fixed 16 kHz mono WAV window over ordinary HTTPS."""\n    assert service is not None\n    if not audio:\n        raise HTTPException(400, "Live audio snapshot was empty.")\n    waveform = decode_live_wav(audio)\n    quality = quality_check(waveform)\n    if quality == "insufficient":\n        raise HTTPException(422, "Live audio contains insufficient speech signal.")\n    score = await asyncio.to_thread(service.predict_window, waveform)\n    risk, level = calculate_risk(score, 1, 100.0, quality)\n    value = round(float(score), 1)\n    return {\n        "window_id": 1,\n        "synthetic_score": value,\n        "risk_score": risk,\n        "risk_level": level,\n        "status": "suspicious" if value >= 60 else "human" if value < 35 else "uncertain",\n        "stability": 100.0,\n        "audio_quality": quality,\n        "windows_analyzed": 1,\n        "mode": service.mode,\n        "detector": service.detector,\n        "model_message": "LIVE MODEL ANALYSIS - real AASIST rolling 4-second window",\n        "timeline": [value],\n    }\n'''
              if marker not in s:
                  raise SystemExit('backend websocket marker missing')
              s = s.replace(marker, endpoint + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('backend/app/ml/inference.py')
          s = p.read_text(encoding='utf-8')
          if 'graph_optimization_level' not in s:
              old = '            session_options = ort.SessionOptions()\n            session_options.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL\n'
              new = '            session_options = ort.SessionOptions()\n            session_options.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL\n            session_options.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL\n'
              if old not in s:
                  raise SystemExit('inference options marker missing')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- frontend ----------
          p = Path('frontend/app/page.tsx')
          s = p.read_text(encoding='utf-8')

          upload_re = re.compile(r'  async function analyzeFile\(file\?: File\) \{.*?\n  \}\n\n  function chooseDemo', re.S)
          upload = '''  async function analyzeFile(file?: File) {
    if (!file) return;
    setBusy(true);
    setAnalysisError(null);
    setLiveError(null);
    setResult({ ...liveListeningResult, mode: "live", model_message: `UPLOADING · ${file.name} · AASIST is analyzing...` });
    scrollToSection("analyze");
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), 180000);
    try {
      if (!API) throw new Error("Backend URL is missing. Set NEXT_PUBLIC_API_URL and rebuild the frontend.");
      const body = new FormData();
      body.append("audio", file);
      let response: Response | null = null;
      let lastError: unknown = null;
      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          response = await fetch(`${API}/api/analyze`, { method: "POST", body, signal: controller.signal, cache: "no-store" });
          if (response.ok) break;
        } catch (error) { lastError = error; }
        if (attempt < 2) await new Promise((resolve) => window.setTimeout(resolve, 1500));
      }
      if (!response) throw new Error(lastError instanceof Error ? `${lastError.message} · Backend: ${API}` : `Failed to reach VOXY backend · ${API}`);
      if (!response.ok) {
        let message = `Audio analysis failed (${response.status}).`;
        try { const payload = await response.json() as { detail?: string }; if (payload.detail) message = payload.detail; } catch {}
        throw new Error(message);
      }
      setResult(await response.json() as Result);
    } catch (error) {
      setAnalysisError(error instanceof DOMException && error.name === "AbortError" ? "Audio analysis timed out after 180 seconds." : error instanceof Error ? error.message : "Audio analysis failed.");
    } finally {
      window.clearTimeout(timeout);
      setBusy(false);
    }
  }

  function chooseDemo'''
          s, count = upload_re.subn(upload, s, count=1)
          if count != 1:
              raise SystemExit('frontend upload function missing')

          live_re = re.compile(r'  async function startLiveSimulation\(\) \{.*?\n  \}\n\n  const title = busy', re.S)
          live = '''  async function startLiveSimulation() {
    setLiveError(null);
    setAnalysisError(null);
    setResult(liveListeningResult);
    pcmChunks.current = [];
    pcmSampleCount.current = 0;
    modelRequestPending.current = false;
    if (!API) { setLiveError("Backend URL is missing. Set NEXT_PUBLIC_API_URL and rebuild the frontend."); return; }
    if (!navigator.mediaDevices?.getUserMedia || !window.AudioContext) { setLiveError("This browser does not support live microphone analysis."); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const context = new AudioContext();
      await context.resume();
      const source = context.createMediaStreamSource(stream);
      const analyserNode = context.createAnalyser();
      analyserNode.fftSize = 2048;
      analyserNode.smoothingTimeConstant = 0.12;
      const processor = context.createScriptProcessor(4096, 1, 1);
      const silent = context.createGain();
      silent.gain.value = 0;
      source.connect(analyserNode);
      source.connect(processor);
      processor.connect(silent);
      silent.connect(context.destination);
      mediaStream.current = stream;
      audioContext.current = context;
      audioSource.current = source;
      analyser.current = analyserNode;
      pcmProcessor.current = processor;
      silentGain.current = silent;
      intentionalStop.current = false;

      const drawWaveform = () => {
        const canvas = waveformCanvas.current;
        const current = analyser.current;
        if (!canvas || !current) return;
        const dpr = window.devicePixelRatio || 1;
        const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        const data = new Uint8Array(current.fftSize);
        current.getByteTimeDomainData(data);
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "rgba(198,233,61,.95)";
        ctx.lineWidth = Math.max(1.5, dpr * 1.5);
        ctx.beginPath();
        const dx = width / data.length;
        for (let index = 0; index < data.length; index += 1) { const x = index * dx; const y = height / 2 + ((data[index] - 128) / 128) * height * 0.42; if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
        ctx.stroke();
        waveformFrame.current = window.requestAnimationFrame(drawWaveform);
      };

      processor.onaudioprocess = (event) => {
        const copy = new Float32Array(event.inputBuffer.getChannelData(0));
        pcmChunks.current.push(copy);
        pcmSampleCount.current += copy.length;
        const keep = Math.ceil(context.sampleRate * (LIVE_WINDOW_SECONDS + 0.5));
        while (pcmChunks.current.length > 1 && pcmSampleCount.current > keep) { const removed = pcmChunks.current.shift(); if (removed) pcmSampleCount.current -= removed.length; }
      };

      const buildWindow = () => {
        const needed = Math.ceil(context.sampleRate * LIVE_WINDOW_SECONDS);
        if (pcmSampleCount.current < needed) return null;
        const joined = new Float32Array(pcmSampleCount.current);
        let offset = 0;
        for (const chunk of pcmChunks.current) { joined.set(chunk, offset); offset += chunk.length; }
        return downsampleToTarget(joined.subarray(Math.max(0, joined.length - needed)));
      };

      const sendWindow = async () => {
        if (modelRequestPending.current) return;
        const samples = buildWindow();
        if (!samples) return;
        modelRequestPending.current = true;
        try {
          const response = await fetch(`${API}/api/live`, { method: "POST", headers: { "Content-Type": "audio/wav" }, body: encodeWav(samples, LIVE_SAMPLE_RATE), cache: "no-store" });
          if (!response.ok) {
            let message = `Live analysis failed (${response.status}).`;
            try { const payload = await response.json() as { detail?: string }; if (payload.detail) message = payload.detail; } catch {}
            throw new Error(message);
          }
          const update = await response.json() as Result;
          setResult({ ...update, mode: "pretrained", model_message: "LIVE MODEL ANALYSIS · real AASIST rolling 4-second window" });
          setLiveError(null);
        } catch (error) {
          setLiveError(error instanceof Error ? error.message : "Live model request failed.");
        } finally {
          modelRequestPending.current = false;
        }
      };

      setLiveSeconds(0);
      setLiveActive(true);
      waveformFrame.current = window.requestAnimationFrame(drawWaveform);
      snapshotTimer.current = window.setInterval(sendWindow, 500);
    } catch (error) {
      setLiveError(error instanceof DOMException && error.name === "NotAllowedError" ? "Microphone permission was denied." : error instanceof Error ? error.message : "Unable to start microphone analysis.");
      stopLiveSimulation();
    }
  }

  const title = busy'''
          s, count = live_re.subn(live, s, count=1)
          if count != 1:
              raise SystemExit('frontend live function missing')
          p.write_text(s, encoding='utf-8')

          Path('.voxy_repair_done').write_text('ok\n', encoding='utf-8')

      - name: Build and test
        shell: bash
        run: |
          python -m py_compile backend/app/main.py backend/app/ml/inference.py backend/app/ml/preprocessing.py
          cd frontend
          npm ci
          npm run build

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/main.py backend/app/ml/inference.py frontend/app/page.tsx .voxy_repair_done
          git commit -m "fix: make live risk scoring reliable"
          git rm .github/workflows/voxy-repair.yml
          git commit -m "chore: remove repair workflow"
          git push origin main
