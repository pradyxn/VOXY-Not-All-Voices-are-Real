name: Fix live microphone streaming

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-live-stream:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch frontend
        run: python scripts/patch_live_microphone.py

      - name: Commit frontend fix
        run: |
          if git diff --quiet; then
            echo "No frontend changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.tsx
          git commit -m "fix: stream complete microphone segments and render live graph"
          git push
