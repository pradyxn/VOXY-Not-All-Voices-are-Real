name: VOXY production reliability patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: production live and upload path') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch backend and frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          # Backend: use the fixed-size live window directly so there is no extra
          # split/quality pass before the single AASIST inference call.
          main = Path('backend/app/main.py')
          text = main.read_text(encoding='utf-8')
          if 'from time import perf_counter' not in text:
              text = text.replace('import tempfile\nimport wave\n', 'import tempfile\nimport wave\nfrom time import perf_counter\n', 1)
          old = '''                timeline = await asyncio.to_thread(service.predict_audio, audio)\n                model_scores, quality = timeline\n\n                if not model_scores:\n                    print("VOXY live: model returned no score for live snapshot")\n                    continue\n\n                score = float(model_scores[-1])\n'''
          new = '''                started = perf_counter()\n                score = await asyncio.to_thread(service.predict_window, audio)\n                elapsed_ms = round((perf_counter() - started) * 1000.0)\n                print(f"VOXY live: AASIST inference completed in {elapsed_ms} ms")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          payload_old = '                    "timeline": scores,\n                }'
          payload_new = '                    "timeline": scores,\n                    "inference_ms": elapsed_ms,\n                }'
          if '"inference_ms": elapsed_ms' not in text and payload_old in text:
              text = text.replace(payload_old, payload_new, 1)
          upload_old = '        timeline, quality = await asyncio.to_thread(service.predict_file, temporary_path)\n        aggregate, stability, windows = aggregate_scores(timeline)'
          upload_new = '        started = perf_counter()\n        timeline, quality = await asyncio.to_thread(service.predict_file, temporary_path)\n        elapsed_ms = round((perf_counter() - started) * 1000.0)\n        print(f"VOXY upload: AASIST analysis completed in {elapsed_ms} ms")\n        aggregate, stability, windows = aggregate_scores(timeline)'
          if upload_old in text:
              text = text.replace(upload_old, upload_new, 1)
          msg_old = '            model_message="AASIST spoof probability derived from the official 2-class output; higher means more synthetic/spoof signal.",'
          msg_new = '            model_message=f"AASIST spoof probability derived from the official 2-class output; higher means more synthetic/spoof signal. Inference: {elapsed_ms} ms.",'
          if msg_old in text and 'Inference: {elapsed_ms}' not in text:
              text = text.replace(msg_old, msg_new, 1)
          main.write_text(text, encoding='utf-8')

          # Inference: force ORT graph optimization while keeping one worker thread.
          inf = Path('backend/app/ml/inference.py')
          text = inf.read_text(encoding='utf-8')
          marker = '            session_options = ort.SessionOptions()\n'
          if marker in text and 'graph_optimization_level' not in text:
              text = text.replace(marker, marker + '            session_options.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL\n', 1)
          inf.write_text(text, encoding='utf-8')

          # Frontend upload: give the request a hard upper bound and put the real
          # upload state in the same result area so a slow CPU model is visible.
          page = Path('frontend/app/page.tsx')
          text = page.read_text(encoding='utf-8')
          if '  inference_ms?: number;' not in text:
              text = text.replace('  timeline: number[];\n};', '  timeline: number[];\n  inference_ms?: number;\n};', 1)
          pattern = re.compile(r'  async function analyzeFile\(file\?: File\) \{.*?\n  \}\n\n  function chooseDemo', re.S)
          replacement = '''  async function analyzeFile(file?: File) {\n    if (!file) return;\n    setBusy(true);\n    setAnalysisError(null);\n    setResult({ ...liveListeningResult, model_message: `UPLOADING · ${file.name} · AASIST analysis in progress...` });\n    scrollToSection("analyze");\n    const controller = new AbortController();\n    const timeout = window.setTimeout(() => controller.abort(), 120000);\n    try {\n      if (!API) throw new Error("Backend URL is missing. Set NEXT_PUBLIC_API_URL and rebuild the frontend.");\n      const body = new FormData();\n      body.append("audio", file);\n      const response = await fetch(`${API}/api/analyze`, { method: "POST", body, signal: controller.signal });\n      if (!response.ok) {\n        let message = `Audio analysis failed (${response.status}).`;\n        try { const payload = await response.json() as { detail?: string }; if (payload.detail) message = payload.detail; } catch {}\n        throw new Error(message);\n      }\n      setResult(await response.json());\n    } catch (error) {\n      setAnalysisError(error instanceof DOMException && error.name === "AbortError" ? "Audio analysis timed out after 120 seconds." : error instanceof Error ? error.message : "Audio analysis failed.");\n    } finally {\n      window.clearTimeout(timeout);\n      setBusy(false);\n    }\n  }\n\n  function chooseDemo'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('upload handler marker missing')
          text = text.replace('snapshotTimer.current = window.setInterval(sendWindow, 1000);', 'snapshotTimer.current = window.setInterval(sendWindow, 250);', 1)
          text = text.replace("setResult({ ...update, mode: 'pretrained', model_message: 'LIVE MODEL ANALYSIS - rolling 4-second AASIST window' });", "setResult({ ...update, mode: 'pretrained', model_message: update.inference_ms ? `LIVE MODEL ANALYSIS · AASIST rolling 4-second window · ${update.inference_ms} ms` : 'LIVE MODEL ANALYSIS - rolling 4-second AASIST window' });", 1)
          page.write_text(text, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          python -m py_compile backend/app/main.py backend/app/ml/inference.py backend/app/ml/preprocessing.py
          cd frontend
          npm ci
          npm run build

      - name: Commit and remove temporary trigger workflow
        shell: bash
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/page.tsx backend/app/main.py backend/app/ml/inference.py
          git commit -m "fix: production live and upload path"
          git rm .github/workflows/apply-live-fix2.yml .github/workflows/fix-live-and-upload.yml || true
          git commit -m "chore: remove temporary patch workflows" || true
          git push origin main
