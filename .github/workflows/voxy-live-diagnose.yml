name: Diagnose VOXY live patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Diagnose markers
        shell: python
        run: |
          from pathlib import Path
          import re
          page = Path('frontend/app/page.tsx').read_text(encoding='utf-8')
          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          checks = {
            'helper_marker': 'function scrollToSection(id: string) {\n  document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });\n}\n' in page,
            'verification_anchor': '  const [verification, setVerification] = useState(false);\n' in page,
            'live_function': bool(re.search(r'  function stopLiveSimulation\(silent = false\) \{.*?\n  const title = busy', page, re.S)),
            'graph_marker': '            </div>{result.risk_score >= 60 &&' in page,
            'webm_suffix': 'with tempfile.NamedTemporaryFile(delete=False, suffix=".webm") as temporary:\n                    temporary.write(chunk)' in main,
            'media_recorder': 'const mediaRecorder = useRef<MediaRecorder | null>(null);' in page,
            'stop_segments': 'const stopSegments = useRef<(() => void) | null>(null);' in page,
            'live_listening': 'const liveListeningResult' in page,
          }
          print(checks)
          Path('patch_diagnostics.txt').write_text('\n'.join(f'{k}={v}' for k,v in checks.items()) + '\nPAGE_SHA_BYTES=' + str(len(page)) + '\nMAIN_SHA_BYTES=' + str(len(main)), encoding='utf-8')
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add patch_diagnostics.txt
          git commit -m "chore: record live patch diagnostics"
          git push origin main
