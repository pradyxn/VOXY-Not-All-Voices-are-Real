name: VOXY live patch final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: live microphone waveform and rolling inference') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          import re

          page_path = Path('frontend/app/page.tsx')
          page = page_path.read_text(encoding='utf-8')

          if 'const LIVE_SAMPLE_RATE = 16000;' not in page:
              marker = 'function scrollToSection(id: string) {\n  document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });\n}\n'
              helper = '''\nconst LIVE_SAMPLE_RATE = 16000;\nconst LIVE_WINDOW_SECONDS = 4.0375;\nconst LIVE_TARGET_SAMPLES = 64600;\n\nfunction downsampleToTarget(input: Float32Array): Float32Array {\n  const output = new Float32Array(LIVE_TARGET_SAMPLES);\n  if (!input.length) return output;\n  const ratio = input.length / LIVE_TARGET_SAMPLES;\n  for (let index = 0; index < LIVE_TARGET_SAMPLES; index += 1) {\n    const position = index * ratio;\n    const left = Math.min(Math.floor(position), input.length - 1);\n    const right = Math.min(left + 1, input.length - 1);\n    const fraction = position - left;\n    output[index] = input[left] + (input[right] - input[left]) * fraction;\n  }\n  return output;\n}\n\nfunction encodeWav(samples: Float32Array, sampleRate: number): ArrayBuffer {\n  const buffer = new ArrayBuffer(44 + samples.length * 2);\n  const view = new DataView(buffer);\n  const write = (offset: number, value: string) => {\n    for (let index = 0; index < value.length; index += 1) view.setUint8(offset + index, value.charCodeAt(index));\n  };\n  write(0, 'RIFF');\n  view.setUint32(4, 36 + samples.length * 2, true);\n  write(8, 'WAVE');\n  write(12, 'fmt ');\n  view.setUint32(16, 16, true);\n  view.setUint16(20, 1, true);\n  view.setUint16(22, 1, true);\n  view.setUint32(24, sampleRate, true);\n  view.setUint32(28, sampleRate * 2, true);\n  view.setUint16(32, 2, true);\n  view.setUint16(34, 16, true);\n  write(36, 'data');\n  view.setUint32(40, samples.length * 2, true);\n  for (let index = 0; index < samples.length; index += 1) {\n    const sample = Math.max(-1, Math.min(1, samples[index]));\n    view.setInt16(44 + index * 2, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);\n  }\n  return buffer;\n}\n'''
              if marker not in page:
                  raise SystemExit('scroll marker not found')
              page = page.replace(marker, marker + helper, 1)

          page = re.sub(
              r'  const mediaRecorder = useRef<MediaRecorder \| null>\(null\);\n  const mediaStream = useRef<MediaStream \| null>\(null\);\n  const socket = useRef<WebSocket \| null>\(null\);\n  const intentionalStop = useRef\(false\);\n  const stopSegments = useRef<\(\(\) => void\) \| null>\(null\);\n',
              '''  const mediaStream = useRef<MediaStream | null>(null);\n  const socket = useRef<WebSocket | null>(null);\n  const audioContext = useRef<AudioContext | null>(null);\n  const audioSource = useRef<MediaStreamAudioSourceNode | null>(null);\n  const analyser = useRef<AnalyserNode | null>(null);\n  const pcmProcessor = useRef<ScriptProcessorNode | null>(null);\n  const silentGain = useRef<GainNode | null>(null);\n  const waveformCanvas = useRef<HTMLCanvasElement | null>(null);\n  const waveformFrame = useRef<number | null>(null);\n  const snapshotTimer = useRef<number | null>(null);\n  const pcmChunks = useRef<Float32Array[]>([]);\n  const pcmSampleCount = useRef(0);\n  const modelRequestPending = useRef(false);\n  const intentionalStop = useRef(false);\n''', page, count=1)

          live_re = re.compile(r'  function stopLiveSimulation\(silent = false\) \{.*?\n  const title = busy', re.S)
          live_code = '''  function stopLiveSimulation(silent = false) {\n    intentionalStop.current = silent;\n    if (snapshotTimer.current !== null) { window.clearInterval(snapshotTimer.current); snapshotTimer.current = null; }\n    if (waveformFrame.current !== null) { window.cancelAnimationFrame(waveformFrame.current); waveformFrame.current = null; }\n    if (pcmProcessor.current) {\n      pcmProcessor.current.onaudioprocess = null;\n      try { pcmProcessor.current.disconnect(); } catch {}\n      pcmProcessor.current = null;\n    }\n    try { silentGain.current?.disconnect(); } catch {}\n    try { audioSource.current?.disconnect(); } catch {}\n    audioSource.current = null; analyser.current = null; silentGain.current = null;\n    if (audioContext.current && audioContext.current.state !== 'closed') void audioContext.current.close();\n    audioContext.current = null;\n    pcmChunks.current = []; pcmSampleCount.current = 0; modelRequestPending.current = false;\n    mediaStream.current?.getTracks().forEach((track) => track.stop());\n    socket.current?.close(1000, 'client stopped');\n    mediaStream.current = null; socket.current = null; setLiveActive(false);\n  }\n\n  async function startLiveSimulation() {\n    setLiveError(null);\n    setAnalysisError(null);\n    setResult(liveListeningResult);\n    pcmChunks.current = [];\n    pcmSampleCount.current = 0;\n    modelRequestPending.current = false;\n    if (!navigator.mediaDevices?.getUserMedia || !window.AudioContext) {\n      setLiveError('This browser does not support live microphone analysis.');\n      return;\n    }\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      const webSocketUrl = getWebSocketUrl(API, window.location.protocol);\n      const liveSocket = new WebSocket(webSocketUrl);\n      const context = new AudioContext();\n      await context.resume();\n\n      const source = context.createMediaStreamSource(stream);\n      const analyserNode = context.createAnalyser();\n      analyserNode.fftSize = 2048;\n      analyserNode.smoothingTimeConstant = 0.12;\n      const processor = context.createScriptProcessor(4096, 1, 1);\n      const silent = context.createGain();\n      silent.gain.value = 0;\n      source.connect(analyserNode);\n      source.connect(processor);\n      processor.connect(silent);\n      silent.connect(context.destination);\n\n      mediaStream.current = stream;\n      socket.current = liveSocket;\n      audioContext.current = context;\n      audioSource.current = source;\n      analyser.current = analyserNode;\n      pcmProcessor.current = processor;\n      silentGain.current = silent;\n      intentionalStop.current = false;\n\n      const drawWaveform = () => {\n        const canvas = waveformCanvas.current;\n        const current = analyser.current;\n        if (!canvas || !current) return;\n        const dpr = window.devicePixelRatio || 1;\n        const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));\n        const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));\n        if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }\n        const ctx = canvas.getContext('2d');\n        if (!ctx) return;\n        const data = new Uint8Array(current.fftSize);\n        current.getByteTimeDomainData(data);\n        ctx.clearRect(0, 0, width, height);\n        ctx.strokeStyle = 'rgba(198,233,61,.95)';\n        ctx.lineWidth = Math.max(1.5, dpr * 1.5);\n        ctx.beginPath();\n        const dx = width / data.length;\n        for (let index = 0; index < data.length; index += 1) {\n          const x = index * dx;\n          const y = height / 2 + ((data[index] - 128) / 128) * height * 0.42;\n          if (index === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n        }\n        ctx.stroke();\n        waveformFrame.current = window.requestAnimationFrame(drawWaveform);\n      };\n\n      processor.onaudioprocess = (event) => {\n        const copy = new Float32Array(event.inputBuffer.getChannelData(0));\n        pcmChunks.current.push(copy);\n        pcmSampleCount.current += copy.length;\n        const keep = Math.ceil(context.sampleRate * (LIVE_WINDOW_SECONDS + 0.5));\n        while (pcmChunks.current.length > 1 && pcmSampleCount.current > keep) {\n          const removed = pcmChunks.current.shift();\n          if (removed) pcmSampleCount.current -= removed.length;\n        }\n      };\n\n      const buildRollingWindow = () => {\n        const needed = Math.ceil(context.sampleRate * LIVE_WINDOW_SECONDS);\n        if (pcmSampleCount.current < needed) return null;\n        const joined = new Float32Array(pcmSampleCount.current);\n        let offset = 0;\n        for (const chunk of pcmChunks.current) { joined.set(chunk, offset); offset += chunk.length; }\n        return downsampleToTarget(joined.subarray(Math.max(0, joined.length - needed)));\n      };\n\n      const sendRollingWindow = () => {\n        if (liveSocket.readyState !== WebSocket.OPEN || modelRequestPending.current) return;\n        const samples = buildRollingWindow();\n        if (!samples) return;\n        modelRequestPending.current = true;\n        logWebSocket('sending rolling 4-second WAV snapshot', { samples: samples.length });\n        liveSocket.send(encodeWav(samples, LIVE_SAMPLE_RATE));\n      };\n\n      liveSocket.onopen = () => {\n        setLiveSeconds(0);\n        setLiveActive(true);\n        if (waveformFrame.current === null) waveformFrame.current = window.requestAnimationFrame(drawWaveform);\n        snapshotTimer.current = window.setInterval(sendRollingWindow, 1000);\n      };\n\n      liveSocket.onmessage = (event) => {\n        modelRequestPending.current = false;\n        try {\n          if (typeof event.data !== 'string') return;\n          const update = JSON.parse(event.data) as Result & { error?: string };\n          logWebSocket('onmessage', update);\n          if (update.error) { setLiveError(update.error); return; }\n          setResult({ ...update, mode: 'pretrained', model_message: 'LIVE MODEL ANALYSIS - rolling 4-second AASIST window' });\n        } catch (error) { logWebSocket('invalid server message', error); }\n      };\n\n      liveSocket.onerror = () => logWebSocket('onerror', 'Network error or connection refused');\n      liveSocket.onclose = (event) => {\n        modelRequestPending.current = false;\n        if (snapshotTimer.current !== null) { window.clearInterval(snapshotTimer.current); snapshotTimer.current = null; }\n        if (waveformFrame.current !== null) { window.cancelAnimationFrame(waveformFrame.current); waveformFrame.current = null; }\n        if (intentionalStop.current || event.code === 1000) setLiveError(null);\n        else if (event.code === 1011 && event.reason.toLowerCase().includes('detector')) setLiveError('Backend closed the connection because the AASIST detector is unavailable.');\n        else if (event.code === 1006) setLiveError('WebSocket connection refused or interrupted. Check that the backend is running and reachable.');\n        else if (event.reason) setLiveError(`Backend closed the live connection (${event.code}): ${event.reason}`);\n        else setLiveError(`Live connection closed unexpectedly (code ${event.code}).`);\n        setLiveActive(false);\n        mediaStream.current?.getTracks().forEach((track) => track.stop());\n        if (audioContext.current && audioContext.current.state !== 'closed') void audioContext.current.close();\n        audioContext.current = null;\n      };\n    } catch (error) {\n      setLiveError(error instanceof DOMException && error.name === 'NotAllowedError' ? 'Microphone permission was denied.' : error instanceof Error ? error.message : 'Unable to start microphone analysis.');\n      stopLiveSimulation();\n    }\n  }\n\n  const title = busy'''
          page, count = live_re.subn(live_code, page, count=1)
          if count != 1:
              raise SystemExit('live function replacement failed')

          graph_re = re.compile(r'(            <div className="timeline-graph" aria-label="Live synthetic score timeline">.*?            </div>)(\{result\.risk_score >= 60 &&)', re.S)
          waveform = r'''\1
            <div className="live-waveform-panel" style={{ marginTop: '10px', borderTop: '1px solid rgba(198,233,61,.12)', paddingTop: '10px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '7px', fontSize: '10px', letterSpacing: '.12em', textTransform: 'uppercase', color: 'rgba(198,233,61,.78)' }}>
                <span>Live audio waveform</span><span>{liveActive ? 'MIC INPUT' : 'STANDBY'}</span>
              </div>
              <canvas ref={waveformCanvas} aria-label="Live microphone waveform" style={{ width: '100%', height: '105px', display: 'block', borderRadius: '10px', background: 'rgba(255,255,255,.018)' }} />
            </div>\2'''
          page, count = graph_re.subn(waveform, page, count=1)
          if count != 1:
              raise SystemExit('waveform insertion failed')

          score_old = '<div className="score">{Math.round(result.synthetic_score)}<span>/100</span></div>'
          score_new = '<div className="score">{liveActive && result.windows_analyzed === 0 ? "—" : Math.round(result.synthetic_score)}<span>/100</span></div>'
          page = page.replace(score_old, score_new, 1)

          page_path.write_text(page, encoding='utf-8')

          main_path = Path('backend/app/main.py')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace('with tempfile.NamedTemporaryFile(delete=False, suffix=".webm") as temporary:\n                    temporary.write(chunk)', 'with tempfile.NamedTemporaryFile(delete=False, suffix=".wav") as temporary:\n                    temporary.write(chunk)', 1)
          main = main.replace(
              'The frontend sends one complete, independently decodable WebM/Opus blob\n    approximately every four seconds. Each blob is decoded exactly once and\n    produces one AASIST score. Keeping segment boundaries explicit avoids trying\n    to decode incomplete MediaRecorder WebM fragments.',
              'The frontend sends complete 16 kHz mono WAV snapshots containing a rolling\n    4-second microphone window. Each snapshot is independently decodable and can\n    be analyzed repeatedly as the speaker continues talking.',
              1,
          )
          main_path.write_text(main, encoding='utf-8')

          # Remove temporary patch workflows from the working tree.
          for path in Path('.github/workflows').glob('*live-fix*.yml'):
              path.unlink(missing_ok=True)
          (Path('.github/workflows') / 'voxy-live-patch-final.yml').unlink(missing_ok=True)

      - name: Validate
        shell: bash
        run: |
          grep -q "const LIVE_SAMPLE_RATE = 16000;" frontend/app/page.tsx
          grep -q "Live audio waveform" frontend/app/page.tsx
          grep -q "encodeWav" frontend/app/page.tsx
          grep -q 'suffix=".wav"' backend/app/main.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/page.tsx backend/app/main.py .github/workflows || true
          git diff --cached --quiet || git commit -m "fix: live microphone waveform and rolling inference"
          git push origin main
