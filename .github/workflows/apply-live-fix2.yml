name: VOXY live patch diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Diagnose
        shell: python
        run: |
          from pathlib import Path
          import re
          page = Path('frontend/app/page.tsx').read_text(encoding='utf-8')
          main = Path('backend/app/main.py').read_text(encoding='utf-8')
          tests = {
            'helper_marker': 'function scrollToSection(id: string) {' in page,
            'verification_anchor': 'const [verification, setVerification] = useState(false);' in page,
            'live_fn': bool(re.search(r'function stopLiveSimulation\(silent = false\).*?const title = busy', page, re.S)),
            'graph_marker': '            </div>{result.risk_score >= 60 &&' in page,
            'webm_suffix': 'suffix=".webm"' in main,
            'media_recorder': 'const mediaRecorder = useRef<MediaRecorder | null>(null);' in page,
            'stop_segments': 'const stopSegments = useRef<(() => void) | null>(null);' in page,
          }
          print(tests)
          Path('patch_diagnostics.txt').write_text('\n'.join(f'{k}={v}' for k,v in tests.items()) + f'\npage_bytes={len(page)}\nmain_bytes={len(main)}\n', encoding='utf-8')
      - name: Commit diagnostic file
        shell: bash
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add patch_diagnostics.txt
          git commit -m "chore: record live patch diagnostics"
          git push origin main
