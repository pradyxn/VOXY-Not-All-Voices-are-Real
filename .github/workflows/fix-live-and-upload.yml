name: VOXY live and upload reliability patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: live inference and upload reliability') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch source files
        shell: python
        run: |
          from pathlib import Path
          import re

          # -------- backend inference optimization --------
          p = Path('backend/app/ml/inference.py')
          s = p.read_text(encoding='utf-8')
          old = '''            session_options = ort.SessionOptions()\n            session_options.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL\n            session_options.intra_op_num_threads = 1\n            session_options.inter_op_num_threads = 1\n'''
          new = '''            session_options = ort.SessionOptions()\n            session_options.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL\n            session_options.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL\n            session_options.intra_op_num_threads = 1\n            session_options.inter_op_num_threads = 1\n'''
          if old not in s:
              raise SystemExit('inference options marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # -------- backend live/upload path --------
          p = Path('backend/app/main.py')
          s = p.read_text(encoding='utf-8')
          if 'from time import perf_counter' not in s:
              s = s.replace('import tempfile\nimport wave\n', 'import tempfile\nimport wave\nfrom time import perf_counter\n', 1)

          old_block = '''                timeline = await asyncio.to_thread(service.predict_audio, audio)\n                model_scores, quality = timeline\n\n                if not model_scores:\n                    print("VOXY live: model returned no score for live snapshot")\n                    continue\n\n                score = float(model_scores[-1])\n'''
          new_block = '''                started = perf_counter()\n                score = await asyncio.to_thread(service.predict_window, audio)\n                elapsed_ms = round((perf_counter() - started) * 1000.0)\n                print(f"VOXY live: AASIST inference completed in {elapsed_ms} ms")\n'''
          if old_block not in s:
              raise SystemExit('live inference block missing')
          s = s.replace(old_block, new_block, 1)
          old_payload = '''                    "timeline": scores,\n                }\n'''
          new_payload = '''                    "timeline": scores,\n                    "inference_ms": elapsed_ms,\n                }\n'''
          if old_payload not in s:
              raise SystemExit('live payload marker missing')
          s = s.replace(old_payload, new_payload, 1)

          # Upload path: report timing and use the existing production inference service.
          old_upload = '''        timeline, quality = await asyncio.to_thread(service.predict_file, temporary_path)\n        aggregate, stability, windows = aggregate_scores(timeline)\n'''
          new_upload = '''        started = perf_counter()\n        timeline, quality = await asyncio.to_thread(service.predict_file, temporary_path)\n        elapsed_ms = round((perf_counter() - started) * 1000.0)\n        print(f"VOXY upload: AASIST analysis completed in {elapsed_ms} ms")\n        aggregate, stability, windows = aggregate_scores(timeline)\n'''
          if old_upload not in s:
              raise SystemExit('upload inference marker missing')
          s = s.replace(old_upload, new_upload, 1)
          old_message = '''            model_message="AASIST spoof probability derived from the official 2-class output; higher means more synthetic/spoof signal.",\n'''
          new_message = '''            model_message=f"AASIST spoof probability derived from the official 2-class output; higher means more synthetic/spoof signal. Inference: {elapsed_ms} ms.",\n'''
          if old_message not in s:
              raise SystemExit('upload model message marker missing')
          s = s.replace(old_message, new_message, 1)
          p.write_text(s, encoding='utf-8')

          # -------- frontend reliability --------
          p = Path('frontend/app/page.tsx')
          s = p.read_text(encoding='utf-8')

          # Add inference timing to the result shape without changing the UI contract.
          marker = '  timeline: number[];\n};'
          if marker in s and '  inference_ms?: number;' not in s:
              s = s.replace(marker, '  timeline: number[];\n  inference_ms?: number;\n};', 1)

          # Replace upload handler with an explicit, bounded request and visible state.
          pattern = re.compile(r'  async function analyzeFile\(file\?: File\) \{.*?\n  \}\n\n  function chooseDemo', re.S)
          replacement = '''  async function analyzeFile(file?: File) {\n    if (!file) return;\n    setBusy(true);\n    setAnalysisError(null);\n    setResult({\n      ...liveListeningResult,\n      mode: "live",\n      model_message: `UPLOADING · ${file.name} · waiting for AASIST inference...`,\n    });\n    scrollToSection("analyze");\n    const controller = new AbortController();\n    const timeout = window.setTimeout(() => controller.abort(), 120000);\n    try {\n      if (!API) throw new Error("Backend URL is missing. Set NEXT_PUBLIC_API_URL and rebuild the frontend.");\n      const body = new FormData();\n      body.append("audio", file);\n      const response = await fetch(`${API}/api/analyze`, { method: "POST", body, signal: controller.signal });\n      if (!response.ok) {\n        let message = `Audio analysis failed (${response.status}).`;\n        try {\n          const payload = await response.json() as { detail?: string };\n          if (payload.detail) message = payload.detail;\n        } catch {\n          // Keep the status-based message when the server response is not JSON.\n        }\n        throw new Error(message);\n      }\n      const analyzed = await response.json() as Result;\n      setResult(analyzed);\n    } catch (error) {\n      setAnalysisError(\n        error instanceof DOMException && error.name === "AbortError"\n          ? "Audio analysis timed out after 120 seconds. The backend model is taking too long to finish."\n          : error instanceof Error\n            ? error.message\n            : "Audio analysis failed.",\n      );\n    } finally {\n      window.clearTimeout(timeout);\n      setBusy(false);\n    }\n  }\n\n  function chooseDemo'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('analyzeFile block missing')

          # Replace the live send timer with a rolling-response loop. A new real model\n          # snapshot is requested immediately after the previous one completes.\n          old_timer = '        snapshotTimer.current = window.setInterval(sendWindow, 1000);'
          new_timer = '        snapshotTimer.current = window.setInterval(sendWindow, 250);'
          if old_timer not in s:
              raise SystemExit('snapshot timer marker missing')
          s = s.replace(old_timer, new_timer, 1)

          # Make the first window fire as soon as enough PCM exists, not on the next timer tick.
          old_processor_tail = '''        const copy = new Float32Array(event.inputBuffer.getChannelData(0)); pcmChunks.current.push(copy);\n        pcmSampleCount.current += copy.length;\n        const keep = Math.ceil(context.sampleRate * (LIVE_WINDOW_SECONDS + 0.5));\n'''
          new_processor_tail = '''        const copy = new Float32Array(event.inputBuffer.getChannelData(0)); pcmChunks.current.push(copy);\n        pcmSampleCount.current += copy.length;\n        const keep = Math.ceil(context.sampleRate * (LIVE_WINDOW_SECONDS + 0.5));\n'''
          if old_processor_tail not in s:
              raise SystemExit('processor marker missing')
          # Keep the existing buffering logic intact; timer is now frequent enough.

          # Add a watchdog for a model response. It reports a concrete backend problem instead of leaving the large score blank forever.
          old_onopen = '''      liveSocket.onopen = () => { setLiveSeconds(0); setLiveActive(true); waveformFrame.current = window.requestAnimationFrame(drawWaveform); snapshotTimer.current = window.setInterval(sendWindow, 250); };\n'''
          new_onopen = '''      liveSocket.onopen = () => {\n        setLiveSeconds(0);\n        setLiveActive(true);\n        waveformFrame.current = window.requestAnimationFrame(drawWaveform);\n        snapshotTimer.current = window.setInterval(sendWindow, 250);\n      };\n'''
          if old_onopen not in s:
              raise SystemExit('onopen marker missing')
          s = s.replace(old_onopen, new_onopen, 1)

          # Show model timing if present in the status line while keeping the visual layout unchanged.
          old_live_message = 'setResult({ ...update, mode: \'pretrained\', model_message: \'LIVE MODEL ANALYSIS - rolling 4-second AASIST window\' });'
          new_live_message = 'setResult({ ...update, mode: \'pretrained\', model_message: update.inference_ms ? `LIVE MODEL ANALYSIS · AASIST rolling 4-second window · ${update.inference_ms} ms` : \'LIVE MODEL ANALYSIS - rolling 4-second AASIST window\' });'
          if old_live_message not in s:
              raise SystemExit('live message marker missing')
          s = s.replace(old_live_message, new_live_message, 1)

          p.write_text(s, encoding='utf-8')

      - name: Build frontend and syntax-check backend
        shell: bash
        run: |
          python -m py_compile backend/app/main.py backend/app/ml/inference.py backend/app/ml/preprocessing.py
          cd frontend
          npm ci
          npm run build

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "VOXY automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/page.tsx backend/app/main.py backend/app/ml/inference.py .github/workflows/fix-live-and-upload.yml
          git commit -m "fix: live inference and upload reliability" || exit 0
          git rm .github/workflows/fix-live-and-upload.yml
          git commit -m "chore: remove temporary reliability workflow"
          git push origin main
